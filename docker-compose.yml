services:
  bot:
    build: .
    container_name: kumpeapps-deployment-bot
    env_file:
      - .env
    environment:
      BOT_PROCESS_ROLE: ${BOT_PROCESS_ROLE:-all}
    volumes:
      - ./.devcontainer/ssh:/workspaces/kumpeapps-deployment-bot/.devcontainer/ssh
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  bot-worker:
    build: .
    container_name: kumpeapps-deployment-bot-worker
    env_file:
      - .env
    environment:
      BOT_PROCESS_ROLE: worker
      PORT: 3001
    volumes:
      - ./.devcontainer/ssh:/workspaces/kumpeapps-deployment-bot/.devcontainer/ssh
    ports:
      - "3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
    profiles:
      - split
    restart: unless-stopped

  bot-test:
    build:
      context: .
      target: builder
    environment:
      SECRET_ENCRYPTION_KEY: test-key-abcdefghijklmnop
      DATABASE_URL: mysql://root:root@mariadb:3306/kumpeapps_bot
      GITHUB_APP_WEBHOOK_SECRET: testsecret
      ADMIN_API_TOKEN: testtoken
    command: npm test
    profiles:
      - test

  mariadb:
    image: mariadb:11.4
    container_name: kumpeapps-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: kumpeapps_bot
      MARIADB_USER: bot
      MARIADB_PASSWORD: botpass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Docker Hub pull-through cache (VM registry-mirrors → this). Auth uses bot DOCKERHUB_* creds.
  docker-hub-cache:
    image: registry:2
    container_name: kumpeapps-docker-hub-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_USERNAME: ${DOCKERHUB_USERNAME:-}
      REGISTRY_PROXY_PASSWORD: ${DOCKERHUB_TOKEN:-}
      REGISTRY_PROXY_TTL: ${DOCKER_REGISTRY_CACHE_TTL:-24h}
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - docker_hub_cache_data:/var/lib/registry
    restart: unless-stopped
    profiles:
      - registry-cache

  # GHCR pull-through cache (compose ghcr.io refs rewritten → this). Auth uses bot GHCR_* creds.
  docker-ghcr-cache:
    image: registry:2
    container_name: kumpeapps-docker-ghcr-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_PROXY_USERNAME: ${GHCR_USERNAME:-}
      REGISTRY_PROXY_PASSWORD: ${GHCR_TOKEN:-}
      REGISTRY_PROXY_TTL: ${DOCKER_REGISTRY_CACHE_TTL:-24h}
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5001:5000"
    volumes:
      - docker_ghcr_cache_data:/var/lib/registry
    restart: unless-stopped
    profiles:
      - registry-cache

volumes:
  mariadb_data:
  docker_hub_cache_data:
  docker_ghcr_cache_data:
